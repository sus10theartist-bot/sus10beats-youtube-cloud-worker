name: Sus10 Beats YouTube Cloud Worker

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Probe the website bridge, or process one queued job'
        required: true
        type: choice
        default: probe
        options:
          - probe
          - process-one

permissions:
  contents: read

concurrency:
  group: sus10-beats-youtube-cloud-worker
  cancel-in-progress: false

jobs:
  process-youtube-queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUS10_SITE_URL: https://sus10beats.great-site.net
      SUS10_WORKER_SECRET: ${{ secrets.SUS10_WORKER_SECRET }}
    steps:
      - name: Check out worker code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
      - name: Install worker dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate cloud configuration
        run: python cloud_runner.py --check
      - name: Probe signed website bridge
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: python cloud_runner.py --probe
      - name: Process one queue job
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'process-one')
        run: python cloud_runner.py --once

name: Sus10 Beats YouTube Cloud Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sus10-beats-youtube-cloud-worker-validation
  cancel-in-progress: false

jobs:
  validate-existing-source:
    name: Validate source only — queue paused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q worker.py cloud_runner.py tests
      - name: Run existing Python tests
        run: python -m unittest discover -s tests -v

# The old direct GitHub-to-InfinityFree queue runner has been paused.
# InfinityFree inserts an HTML browser challenge on incoming non-browser calls.
# Replace this validation-only workflow with the RC7 Cloudflare reverse-bridge
# workflow from the RC7 package after its files are uploaded to this repository.
